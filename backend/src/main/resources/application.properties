# Server Port
server.port=8081

# Load optional local secrets file (git-ignored) if present
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Razorpay Test Mode Keys (set in application-local.properties or env vars)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jersey4u_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
